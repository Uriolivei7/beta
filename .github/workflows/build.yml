name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 1

      - name: Checkout or Create Builds Branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"
          fetch-depth: 1

      - name: Clean builds folder
        run: |
          cd $GITHUB_WORKSPACE/builds
          rm -f *.cs3
          rm -f plugins.json
          rm -rf plugins/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          cd $GITHUB_WORKSPACE/src
          echo "WASMAPI=${{ secrets.WASMAPI_KEY }}" > local.properties

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          for i in 1 2 3; do
            echo "Intento $i de build..."
            ./gradlew make --stacktrace --refresh-dependencies --no-build-cache && break
            echo "Intento $i falló, esperando 30s..."
            sleep 30
          done

      - name: Copy built plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          find . -path '*/build/*.cs3' -not -path '*/builds/*' -not -path '*/.gradle/*' -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          echo "=== .cs3 files in builds ==="
          ls -la $GITHUB_WORKSPACE/builds/*.cs3 || echo "NO .cs3 FILES FOUND"

      - name: Restore plugins.json
        run: |
          cp -f "$GITHUB_WORKSPACE/src/plugins.json" "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Commit and Push builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add -A

          if git diff --staged --quiet; then
            echo "Nada que actualizar."
          else
            git commit -m "Build: Actualizacion automatica de plugins y JSON"
            git push origin HEAD:builds --force
          fi
